<style>
:root{--bg:#0b0b14;--card:#1c1c2e;--txt:#fff;--acc:#22c55e;--acc2:#a855f7}
*{box-sizing:border-box;font-family:system-ui,Arial,sans-serif}
body{background:radial-gradient(600px 300px at 50% -50px,#2e1065,transparent),var(--bg);color:var(--txt);margin:0;padding:14px;padding-bottom:40px}
.topo{text-align:center;padding:18px 10px 6px}
.topo h1{font-size:30px;margin:0}
.topo h1 span{background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.card{background:var(--card);border:1px solid #ffffff18;border-radius:20px;padding:16px;margin:12px 0}
button{width:100%;padding:14px;border:0;border-radius:14px;background:linear-gradient(90deg,var(--acc),var(--acc2));color:#fff;font-weight:800;font-size:16px;margin:6px 0;cursor:pointer}
button.sec{background:#2a2a3d}
button.cx{background:#262640;border:2px solid #444}
button.cx.ativo{background:linear-gradient(90deg,var(--acc),var(--acc2));border-color:#fff}
button.pausado{background:linear-gradient(90deg,#ef4444,#f97316)}
button.liberado{background:linear-gradient(90deg,#22c55e,#14b8a6)}
button.ouro{background:linear-gradient(90deg,#eab308,#f97316);color:#111}
button.escolher{width:auto;padding:10px 14px;font-size:13px;white-space:nowrap}
button.mini{width:auto;padding:8px 12px;font-size:13px;margin:4px 2px}

input,textarea,select{width:100%;padding:13px;border-radius:12px;border:1px solid #444;background:#111;color:#fff;margin:6px 0;font-size:15px}
textarea{min-height:70px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid button{font-size:14px;padding:18px 8px;background:#262640;border:1px solid #ffffff15}
.grid button b{display:block;font-size:22px}
.hidden{display:none!important}
.item{background:#111;padding:14px;border-radius:14px;margin:8px 0;display:flex;justify-content:space-between;gap:10px;align-items:center}
.cx-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.cx-grid button{padding:14px 4px}
.frase{background:linear-gradient(135deg,#fef08a,#fde68a);color:#111;padding:16px;border-radius:16px;text-align:center;font-weight:900;font-size:19px;line-height:1.3;margin:12px 0}
.frase small{display:block;font-weight:600;font-size:13px;margin-top:6px}
.tema{padding:14px;border-radius:12px;text-align:center;cursor:pointer;color:#fff;font-weight:800}
.badge{display:inline-block;background:var(--acc);padding:5px 12px;border-radius:20px;font-size:12px;font-weight:800}
.badge-ja{background:#eab308;color:#111}
.badge-sug{background:#f59e0b;color:#111}
.foto{width:88px;height:88px;border-radius:50%;object-fit:cover;border:3px solid var(--acc);display:block;margin:0 auto 8px}
.center{text-align:center}
.btn-foto{display:block;background:#2a2a3d;padding:14px;border-radius:12px;text-align:center;font-weight:800;cursor:pointer;margin:6px 0}
.qr-box{background:#fff;color:#111;border-radius:16px;padding:20px;text-align:center;margin:12px 0}
.qr-box img{width:220px;height:220px}
.qr-box.mesa{background:linear-gradient(135deg,#fef08a,#fff);border:4px solid #111}
.qr-box.mesa img{width:260px;height:260px}
.qr-box.pb{background:#fff;border:2px solid #111}
.qr-box.colorido{background:linear-gradient(135deg,#22c55e,#a855f7,#ec4899);color:#fff}
.qr-box.colorido img{border:6px solid #fff;border-radius:12px}
.recado-box{background:#fef08a;color:#111;padding:12px;border-radius:12px;margin:8px 0;font-size:14px}
.passo{background:#2a2a3d;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:800}
.musica-nome{font-size:20px;font-weight:900;line-height:1.2}
.musica-artista{font-size:13px;opacity:.75;margin-top:3px}
.musica-artista b{color:#a855f7}
.label-campo{font-size:13px;font-weight:800;opacity:.9;margin:10px 0 0;display:block}
.check{font-size:13px;display:flex;gap:8px;align-items:flex-start;background:#2a2a3d;padding:10px;border-radius:12px;margin:6px 0}
.check input{width:auto;margin:3px 0}
.stars{display:flex;gap:8px;justify-content:center;margin:10px 0}
.avaliacao-card{background:#111;padding:14px;border-radius:14px;margin:8px 0;border-left:4px solid #22c55e}
.avaliacao-card.ruim{border-left-color:#ef4444;background:#2a1212}
.avaliacao-card.media{border-left-color:#eab308}
#alertaNovo{position:fixed;inset:0;z-index:99999;background:linear-gradient(180deg,#dc2626,#991b1b);color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px;animation:pisca 0.9s infinite}
@keyframes pisca{0%{background:linear-gradient(180deg,#dc2626,#991b1b)}50%{background:linear-gradient(180deg,#f97316,#dc2626)}100%{background:linear-gradient(180deg,#dc2626,#991b1b)}}
#alertaNovo h1{font-size:42px;margin:0;line-height:1}
#alertaNovo .pedido-grande{font-size:26px;font-weight:900;margin:18px 0;line-height:1.3;background:#fff;color:#111;padding:18px;border-radius:16px;width:100%;min-height:60px}
#alertaNovo button{background:#fff;color:#111;font-size:20px;padding:18px}
.sug-box{background:#fef3c7;color:#111;border-radius:16px;padding:14px;text-align:center;margin:10px 0}
#btnInstalarTopo{background:linear-gradient(90deg,#22c55e,#14b8a6);animation:pulso 1.5s infinite}
@keyframes pulso{0%{transform:scale(1)}50%{transform:scale(1.03)}100%{transform:scale(1)}}
@media print{body *{visibility:hidden}#printArea,#printArea *{visibility:visible}#printArea{position:absolute;left:0;top:0;width:100%}}
</style>
</head>
